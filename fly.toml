app = "propiq-valuation"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    type = "http"
    port = 8001
    path = "/health"
    interval = "30s"
    timeout = "5s"
